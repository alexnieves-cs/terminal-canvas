# TEMPORARY (Stream A triage): each known-red Electron suite on its own runner, run
# three times in a row there, so a flake shows as a rate and each failure is read in
# isolation. One job per suite rather than per run: macOS runners are scarce and
# shared, and setup is half of each job. Deleted before merge.
name: triage
on:
  push:
    branches: [claude/project-thread-gobh8m]
    # Only what can change a panels suite's result: a CI-only commit must not
    # cancel and restart twenty-one macOS jobs.
    paths: ['scripts/verify-panels-*.cjs', 'scripts/panels-*.cjs', 'src/**', '.github/workflows/triage.yml']
  workflow_dispatch:
concurrency:
  group: triage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: ['panels:flowchart']
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: brew install tmux
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      # Flowchart only, while perf.2's lost page is diagnosed: the PRODUCTION renderer,
      # unminified. The development build never threw (6/6, a warning only), because
      # #185 is the production commit counter; unminified, its stack names the setState.
      - if: matrix.suite == 'panels:flowchart'
        # electron-vite has no --minify flag, so the runner's copy of the config
        # (never committed) turns the renderer's minifier off.
        run: |
          perl -0pi -e 's/(renderer: \{.*?build: \{)/$1 minify: false,/s' electron.vite.config.ts
          grep -nE 'minify: false' electron.vite.config.ts
          npx electron-vite build
          # The #185 stack ends in React's passive effects, which name no component:
          # record the component chain of every useSyncExternalStore forced re-render
          # (the loop's only named step) for the trap to print when it throws.
          node -e '
            const fs = require("fs"); const dir = "out/renderer/assets/"
            for (const f of fs.readdirSync(dir).filter((n) => /^index-.*\.js$/.test(n))) {
              const src = fs.readFileSync(dir + f, "utf8"); const at = "function forceStoreRerender(fiber) {"
              if (!src.includes(at)) continue
              const probe = "try { const n = []; for (let x = fiber, k = 0; x && k < 5; x = x.return) { const t = x.type; if (t && typeof t !== \"string\") { n.push(t.displayName || t.name || (t.type && (t.type.displayName || t.type.name)) || (t.render && t.render.name) || \"?\"); k++ } } const r = (window.__fsr = window.__fsr || []); r.push(n.join(\"<\")); if (r.length > 120) r.shift() } catch {}"
              fs.writeFileSync(dir + f, src.replace(at, at + probe)); console.log("probed " + f)
            }'
      - name: Run suite three times
        env:
          TC_WATCHDOG_SCALE: '2'
          # Flowchart six times while perf.2's render loop (1 run in about 6) is caught.
          RUNS: ${{ matrix.suite == 'panels:flowchart' && '1 2 3 4 5 6' || '1 2 3' }}
        # A hung suite must still report: stop each run at 18 minutes and keep what it logged.
        run: |
          for i in $RUNS; do
            perl -e 'alarm 1080; exec @ARGV' npm run verify:${{ matrix.suite }} > suite-$i.log 2>&1 || true
            pkill -f Electron || true
            echo "=== run $i: $(grep -E '^[0-9]+/[0-9]+ passed' suite-$i.log | tail -1)"
          done
      - name: Failures only
        env:
          RUNS: ${{ matrix.suite == 'panels:flowchart' && '1 2 3 4 5 6' || '1 2 3' }}
        run: |
          for i in $RUNS; do
            echo "=== ${{ matrix.suite }} run $i"
            grep -E '^[0-9]+/[0-9]+ passed' suite-$i.log | tail -1 || true
            grep -E '^(FAIL|\s*FAIL)' suite-$i.log | cut -c1-2500 || true
            grep -nE 'watchdog — run did not finish' suite-$i.log || true
            grep -nE 'reloadWithin:|^\[106\]' suite-$i.log | cut -c1-600 || true
            grep -nE '^\[renderer-error\]' suite-$i.log | cut -c1-4000 || true
            echo "--- tail"; tail -30 suite-$i.log | cut -c1-300
          done
      # The bundle lines a renderer error's stack names (the development build is
      # unminified, so each line is readable source).
      - if: matrix.suite == 'panels:flowchart'
        name: Stack lines
        run: |
          grep -hoE '[A-Za-z0-9_.-]+\.js:[0-9]+:[0-9]+' suite-*.log | sort | uniq -c | sort -rn | head -40 | while read n loc; do
            f=${loc%%:*}; rest=${loc#*:}; l=${rest%%:*}
            [ -f "out/renderer/assets/$f" ] || continue
            echo "--- $loc (x$n)"; sed -n "$((l>4 ? l-4 : 1)),$((l+1))p" "out/renderer/assets/$f" | cut -c1-240
          done
      # Red unless all three runs reported and none failed: the job's colour is the verdict.
      - name: Verdict
        env:
          RUNS: ${{ matrix.suite == 'panels:flowchart' && '1 2 3 4 5 6' || '1 2 3' }}
        run: |
          for i in $RUNS; do
            grep -qE '^[0-9]+/[0-9]+ passed' suite-$i.log || { echo "run $i: no summary"; exit 1; }
            ! grep -qE '^FAILED|^FAIL ' suite-$i.log || { echo "run $i: failed"; exit 1; }
          done
