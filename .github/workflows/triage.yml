# TEMPORARY (follow-up PR): one runner per failing Electron suite so each failure is
# read in isolation, with only its FAIL lines printed. Deleted before merge.
name: triage
on:
  push:
    branches: [claude/project-thread-37cerf]
  workflow_dispatch:
concurrency:
  group: triage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [pty-manager, 'panels:core', 'panels:shell', 'panels:kinds', 'panels:agents', 'panels:product', 'panels:orchestrate', 'panels:flowchart']
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: brew install tmux
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Run suite
        run: npm run verify:${{ matrix.suite }} > suite.log 2>&1 || true
      - name: Failures only
        run: |
          echo "=== ${{ matrix.suite }}: summary"
          grep -E '^[0-9]+/[0-9]+ passed|^FAILED' suite.log | cut -c1-300 || true
          echo "=== FAIL lines"
          grep -E '^(FAIL|\s*FAIL)' suite.log | cut -c1-2500 || true
          echo "=== errors"
          grep -nE 'Error|rejection|watchdog' suite.log | grep -v MaxListeners | cut -c1-400 | head -40 || true
