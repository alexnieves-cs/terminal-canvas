# The whole quality signal, on every push and pull request.
#
# macOS only, and not as a preference: node-pty is compiled natively against
# Electron's ABI at postinstall, the session backend shells out to tmux, and the
# app is a macOS desktop application. A Linux runner could not build it, let
# alone exercise it.
#
# One job, not two. An enumerated list of suites — a "plain node" job and an
# "electron" job each naming its own scripts by hand — cannot see a new suite:
# a task that adds verify:something and forgets this file leaves it silently
# unrun in CI forever, the exact stale-by-omission failure verify-meta.cjs's
# own check 14 exists to prevent, reintroduced here if the chain is spelled out
# by name. `npm run verify` is this repository's own declared single
# green-or-not signal (CLAUDE.md says so directly), so CI runs exactly that,
# and nothing more.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Seven Electron suites are not yet reliable on the runner: core, agents and
# product still carry checks written for the pre-6.0 layout, and shell, kinds,
# orchestrate and flowchart pass on their own runner but flake one different
# check per run inside the full harness (state races, frame-time budgets). They
# stay RUNNING in `verify-electron-known-red`,
# which cannot fail the PR, while `verify` runs everything else and blocks. The
# two lists below are the whole partition: scripts/verify-all.cjs errors on a
# name that matches no suite, so a typo cannot drop one from both jobs. Remove a
# name here when its suite is fixed; when the list is empty, delete the second job.
env:
  KNOWN_RED: verify:panels:core,verify:panels:shell,verify:panels:kinds,verify:panels:agents,verify:panels:product,verify:panels:orchestrate,verify:panels:flowchart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: macos-latest
    # The brief's two-job split budgeted 25 + 35 minutes because those jobs ran
    # in PARALLEL, each needing its own ceiling for the sequential work inside
    # it. Collapsing them into one job removes that parallelism, so this job
    # now performs both tiers' work sequentially plus a cold `npm ci` that
    # runs electron-rebuild against node-pty before any of it starts — the
    # correct budget is closer to the SUM, not less than either half. GitHub
    # bills minutes actually consumed, so a generous ceiling costs nothing; a
    # tight one produces a timeout, a red badge indistinguishable from a real
    # failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # M135. verify:meta panels-split.2 reads scripts/verify-panels.cjs at
          # the `pre-v7-run` commit through `git show`; a depth-1 checkout has
          # no such commit and the check would read as red on the runner for a
          # reason that is not the code's. The check names the commit by sha
          # because the tag was never pushed; full history is what it needs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: verify:relay and verify:canvas-sync use the global
          # `WebSocket`, which Node only has from 22. On 20 they threw
          # `WebSocket is not defined`, and relay then hung to its watchdog.
          node-version: 22
          cache: npm

      # Several suites skip loudly rather than failing when no tmux binary is
      # found. This is what makes them actually run instead of silently skip.
      - name: Install tmux
        run: brew install tmux

      # postinstall runs electron-rebuild against node-pty. This is the step
      # that fails first if the native toolchain is wrong.
      - name: Install dependencies
        run: npm ci
      # M125's first CI run after the ship: every plain-node suite passed on the
      # runner (the across fixture's fix held), then the chain died at verify:pty
      # with `Electron.app: No such file or directory` — npm ci on the runner did
      # not leave Electron's binary in node_modules (the README's own
      # `Error: Electron uninstall` gotcha). Fetch it explicitly; a no-op when
      # the postinstall already did.
      - name: Fetch Electron's binary
        run: node node_modules/electron/install.js

      # The whole harness: every plain-node suite, the typecheck, the build,
      # and every suite that needs the real Electron runtime and a hidden
      # window. Since M237 `npm run verify` is scripts/verify-all.cjs, which
      # DERIVES its suite list from package.json — so the stale-by-omission
      # failure the one-job decision above avoids is now impossible on the
      # other side too, and neither this file nor a chain can forget a suite.
      # Each suite's output is buffered and flushed as one block headed by its
      # name and its own N/M, so a failure here still names its suite even
      # though the plain tier now runs concurrently; the run ends with a
      # slowest-first table of every suite.
      - name: Run the full verification harness
        env:
          TC_VERIFY_SKIP: ${{ env.KNOWN_RED }}
          # The runner is roughly twice as slow as the machine the watchdogs were
          # measured on; headroom.1 skips itself above 1, so a slow runner
          # cannot read as a regression.
          TC_WATCHDOG_SCALE: '2'
        run: npm run verify

  # Non-blocking by construction: continue-on-error keeps the PR green whatever
  # this job reports, and its log is where the follow-up work reads failures.
  verify-electron-known-red:
    name: verify (known-red Electron suites, non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # M135. verify:meta panels-split.2 reads scripts/verify-panels.cjs at
          # the `pre-v7-run` commit through `git show`; a depth-1 checkout has
          # no such commit and the check would read as red on the runner for a
          # reason that is not the code's. The check names the commit by sha
          # because the tag was never pushed; full history is what it needs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: verify:relay and verify:canvas-sync use the global
          # `WebSocket`, which Node only has from 22. On 20 they threw
          # `WebSocket is not defined`, and relay then hung to its watchdog.
          node-version: 22
          cache: npm

      # Several suites skip loudly rather than failing when no tmux binary is
      # found. This is what makes them actually run instead of silently skip.
      - name: Install tmux
        run: brew install tmux

      # postinstall runs electron-rebuild against node-pty. This is the step
      # that fails first if the native toolchain is wrong.
      - name: Install dependencies
        run: npm ci
      # M125's first CI run after the ship: every plain-node suite passed on the
      # runner (the across fixture's fix held), then the chain died at verify:pty
      # with `Electron.app: No such file or directory` — npm ci on the runner did
      # not leave Electron's binary in node_modules (the README's own
      # `Error: Electron uninstall` gotcha). Fetch it explicitly; a no-op when
      # the postinstall already did.
      - name: Fetch Electron's binary
        run: node node_modules/electron/install.js

      - name: Run the known-red Electron suites
        env:
          TC_VERIFY_ONLY: ${{ env.KNOWN_RED }}
          TC_WATCHDOG_SCALE: '2'
        run: npm run verify

  # M462. The visual suite (scripts/verify-visual.cjs): every shot scene painted
  # and compared with its committed golden. NON-BLOCKING until Stream B has
  # written goldens a person looked at (and captured where this job paints, or
  # every scene differs by the machine, not the app); it then joins the blocking
  # job and HAND_RUN in verify-all.cjs loses it. Every scene's PNG is uploaded,
  # with a diff and the fresh half-size capture beside each one that failed, so
  # the run is something a person can look at, not only a count.
  verify-visual:
    name: verify:visual (non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The shot harness spawns real shells and tmux-backed sessions for some scenes.
      - name: Install tmux
        run: brew install tmux
      - name: Install dependencies
        run: npm ci
      - name: Fetch Electron's binary
        run: node node_modules/electron/install.js
      # verify:visual consumes the build; it does not make one.
      - name: Build
        run: npm run build
      - name: Run verify:visual
        env:
          # The goldens are 2x captures; the runner's display is 1x.
          TC_VISUAL_SCALE: '2'
          TC_WATCHDOG_SCALE: '2'
          VISUAL_SHOT_DIR: ${{ github.workspace }}/out/visual/shots
        run: npm run verify:visual
      - name: Upload the scenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ github.run_id }}
          path: out/visual/
          if-no-files-found: warn
          retention-days: 14
