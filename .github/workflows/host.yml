# Lane Q (M594). The hosted version, proved on Linux: the host bundle boots
# the app's real main process with Electron swapped out, a real browser
# signs in and runs a shell on it, and the container image does the same.
#
# Ubuntu, because a host is Linux. `--ignore-scripts` skips the postinstall's
# electron-rebuild of node-pty (Electron's ABI); the host needs node-pty for
# plain Node, built in its own step.
#
# Not part of `verify`: the gate is `npm run verify` on the Mac runner
# (verify.yml). verify:host pins this file's shape (host.ci.*).
name: host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build node-pty for this Node
        run: npx --yes node-gyp rebuild --directory node_modules/node-pty
      - name: Build the host
        run: npm run build:host
      # The runner's own Chrome, driven by playwright-core: no browser
      # download, and --no-save keeps package.json and the lock unchanged.
      - name: Install the browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Smoke-test the host in a browser
        run: node scripts/host-smoke.cjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the image
        run: docker build -f deploy/host/Dockerfile -t terminal-canvas-host .
      - name: Run it
        run: |
          docker run -d --name tch -p 8099:8080 -e TC_HOST_TOKEN=ci-image-token-0123456789 terminal-canvas-host
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8099/healthz && break; sleep 1; done
      # Outside the checkout: this job never installs the app's own tree.
      - name: Install the browser driver
        run: npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright-core@1.55.0
      - name: Smoke-test the image in a browser
        env:
          HOST_URL: http://127.0.0.1:8099
          HOST_TOKEN: ci-image-token-0123456789
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node scripts/host-smoke.cjs
      - name: Container log
        if: always()
        run: docker logs tch 2>&1 | tail -80
