# The release (M467): a `v*` tag becomes a GitHub release with a DMG that
# verify:packaged passed on the same runner.
#
# verify:packaged is the pre-release gate CLAUDE.md names and keeps OUT of
# `npm run verify` (minutes, electron-builder's own downloads). This is where
# it runs: it packages the app, strips PATH the way launchd does, launches the
# real binary and checks node-pty loads from outside the asar. A tag whose
# build fails it gets no release.
#
# Unsigned on purpose for 6.0.0 (the owner's call, 2026-10-21): builder-config
# pins `identity: null`, and verify:package checks that pin. The release body
# says how to open an unsigned app; the job also records what `codesign`
# makes of the bundle.
#
# M630: signed and notarized WHEN THE APPLE SECRETS EXIST, unsigned otherwise.
# The "Signing mode" step decides once, from the secrets alone, and everything
# after reads its output: the DMG step sets TC_MAC_SIGN=1 (the only switch
# builder-config honours), the check step turns codesign, Gatekeeper and the
# stapled ticket into a GATE, and the release notes drop the Open Anyway
# steps. No secrets (a fork, or before the owner adds them) is today's unsigned
# build, unchanged. A HALF set is red, never a quiet fall back to unsigned: a
# release that was meant to be signed must not ship without it. The secrets
# and how to make them: docs/release-signing.md.
#
# Run by hand (workflow_dispatch), or on a PR that touches the packaging, it
# does everything except publish, so the pipeline is proved without minting a
# tag. The DMG is still uploaded as an artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Run from main: tag v<package.json version> on this commit and publish it (for a session that cannot push tags)'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build/**
      - electron-builder.config.cjs
      - scripts/verify-packaged.cjs

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # arm64. macos-latest is Apple silicon; an Intel build is a second job
    # when someone asks for one.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # verify:packaged launches two real instances against a scratch tmux socket.
      - name: Install tmux
        run: brew install tmux

      - name: Install dependencies
        run: npm ci
      - name: Fetch Electron's binary
        run: node node_modules/electron/install.js

      # A tag that disagrees with package.json would publish a DMG whose
      # About box and update check name a different version than the release.
      - name: The tag is package.json's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      # M474. The dispatch door to the same release: a cloud session can merge
      # to main but its git proxy refuses a tag push, so `release: true` on a
      # run from main mints the tag here, from package.json, and the publish
      # step below creates it on this exact commit. Same gate, same DMG. It
      # refuses another branch and an existing tag: a published version is
      # never rewritten (v6.0.0 already was one when 6.0.1 shipped).
      - name: The dispatch names its tag
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release: true runs only from main (this is $GITHUB_REF)"
            exit 1
          fi
          tag="v$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; bump package.json first"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Package config checks
        run: npm run verify:package

      # M630. Signed iff the certificate AND one notarization credential set
      # are present. Secrets cannot be read in `if:`, so they come in as env
      # and the decision leaves as an output.
      - name: Signing mode
        id: sign
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          any=""; for v in "$CERT" "$CERT_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID" "$API_KEY" "$API_KEY_ID" "$API_ISSUER"; do [ -n "$v" ] && any=1; done
          if [ -z "$any" ]; then
            echo "No Apple secrets: building UNSIGNED (docs/release-signing.md says how to turn signing on)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::Some Apple secrets are set but MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD are not. Add both, or remove the rest to build unsigned."
            exit 1
          fi
          if [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            notary=api
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            notary=appleid
          else
            echo "::error::The certificate is set but no complete notarization set is: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER."
            exit 1
          fi
          echo "Signing with the Developer ID certificate; notarizing with: $notary"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "notary=$notary" >> "$GITHUB_OUTPUT"

      # Builds, packages a --dir bundle and launches it. The gate.
      - name: verify:packaged
        env:
          TC_WATCHDOG_SCALE: '2'
        run: npm run verify:packaged

      # The DMG itself. `--publish never`: the release step below is the only
      # thing that talks to GitHub, so a failed upload cannot leave half a
      # release behind with electron-builder's own naming.
      - name: Build the DMG (unsigned)
        if: steps.sign.outputs.signed != 'true'
        env:
          # Unsigned by decision; stop electron-builder hunting the keychain
          # for an identity the runner does not have.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.config.cjs --mac --publish never

      # M630. CSC_LINK takes the base64 .p12 as-is; electron-builder imports
      # it into a throwaway keychain, signs every Mach-O in the bundle (node-pty
      # and spawn-helper in app.asar.unpacked included) with the hardened
      # runtime, submits the .app to Apple's notary service, waits, staples the
      # ticket, then builds the DMG around the stapled app. Expect it to take
      # several minutes longer than the unsigned build.
      - name: Build the DMG (signed and notarized)
        if: steps.sign.outputs.signed == 'true'
        env:
          TC_MAC_SIGN: '1'
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY: ${{ steps.sign.outputs.notary }}
          ID: ${{ secrets.APPLE_ID }}
          ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Only the chosen set reaches electron-builder: given both, it would
          # pick one by its own precedence, not ours.
          if [ "$NOTARY" = api ]; then
            key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
            printf '%s\n' "$API_KEY" > "$key"
            export APPLE_API_KEY="$key" APPLE_API_KEY_ID="$API_KEY_ID" APPLE_API_ISSUER="$API_ISSUER"
          else
            export APPLE_ID="$ID" APPLE_APP_SPECIFIC_PASSWORD="$ID_PASSWORD" APPLE_TEAM_ID="$TEAM_ID"
          fi
          npx electron-builder --config electron-builder.config.cjs --mac --publish never
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Checksums and a codesign note
        id: files
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          cd release
          ls -la
          dmg=$(ls *.dmg | head -1)
          shasum -a 256 "$dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          app=$(ls -d mac*/*.app | head -1)
          if [ "$SIGNED" = true ]; then
            # M630. A GATE when signed: the seal holds, Gatekeeper accepts the
            # app as a notarized Developer ID app, and the ticket is stapled
            # (so it opens offline on first launch). Any of the three failing
            # means users would see the warning signing exists to remove.
            set -o pipefail
            { codesign --verify --deep --strict --verbose=2 "$app" 2>&1
              codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
              spctl --assess --type execute --verbose=2 "$app" 2>&1
              xcrun stapler validate "$app" 2>&1; } | tee codesign.txt
          else
            # Not a gate: the build is unsigned by decision. What macOS will
            # make of it is written down so nobody has to guess.
            { codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || true; } | tee codesign.txt
          fi
          echo "dmg=release/$dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
            release/codesign.txt
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.files.outputs.dmg }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
          cat > notes.md <<EOF
          ## Install

          1. Download \`$(basename "$DMG")\` below (Apple silicon) and open it.
          2. Drag **Terminal Canvas** into Applications and open it. The app is signed with an Apple Developer ID and notarized by Apple, so it opens without a warning.

          Check the download against \`SHA256SUMS.txt\`: \`shasum -a 256 -c SHA256SUMS.txt\`.

          The packaged app passed \`verify:packaged\` on the build runner, and its signature, Gatekeeper assessment and stapled notarization ticket were checked, before this release was created.
          EOF
          else
          cat > notes.md <<EOF
          ## Install

          1. Download \`$(basename "$DMG")\` below (Apple silicon) and open it.
          2. Drag **Terminal Canvas** into Applications.
          3. This build is **not signed** with an Apple Developer ID, so macOS stops the first launch.
             Open it once from **System Settings → Privacy & Security → Open Anyway**
             (on older macOS, right-click the app and choose **Open**).
             If macOS says the app "is damaged", run this once in Terminal and open it again:
             \`xattr -dr com.apple.quarantine "/Applications/Terminal Canvas.app"\`

          Check the download against \`SHA256SUMS.txt\`: \`shasum -a 256 -c SHA256SUMS.txt\`.

          The packaged app passed \`verify:packaged\` on the build runner before this release was created.
          EOF
          fi
          # The version's own notes, under the install steps, when the repo has them.
          notes="docs/release-notes/${TAG#v}.md"
          if [ -f "$notes" ]; then { echo; tail -n +2 "$notes"; } >> notes.md; fi
          # A tag push already has its tag; a dispatch has it created here, on
          # the commit that was just packaged and gated.
          if [ "$GITHUB_REF_NAME" = "$TAG" ]; then verify=--verify-tag; else verify="--target $GITHUB_SHA"; fi
          gh release create "$TAG" "$DMG" release/SHA256SUMS.txt \
            --title "Terminal Canvas ${TAG#v}" \
            --notes-file notes.md \
            $verify
