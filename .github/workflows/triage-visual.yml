# TEMPORARY (Stream A, M463): paints every scene three times in parallel and
# prints the scenes under study into the log as small JPEGs, so a cloud
# session that cannot download artifacts can look at them. Deleted before merge.
name: triage-visual
on:
  push:
    branches: [claude/project-thread-gobh8m]
jobs:
  paint:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Run verify:visual
        continue-on-error: true
        env:
          TC_VISUAL_SCALE: '2'
          TC_SHOT_SCALE: '2'
          TC_WATCHDOG_SCALE: '2'
          VISUAL_SHOT_DIR: ${{ github.workspace }}/out/visual/shots
        run: npm run verify:visual
      - name: Print the scenes under study
        if: always()
        run: |
          mkdir -p /tmp/peek
          for s in edge-firing edge-waiting rd-world-focus workflow orchestration rd-world-transition-rm chat integrations orchestration-watch starter rd-world-transition rd-plan-palette; do
            for kind in shot diff; do
              if [ "$kind" = shot ]; then f="out/visual/shots/$s.png"; else f="out/visual/$s.diff.png"; fi
              [ -f "$f" ] || continue
              sips -s format jpeg -s formatOptions 55 -Z 1100 "$f" --out "/tmp/peek/$s.$kind.jpg" >/dev/null
              echo "=====BEGIN $s.$kind====="
              base64 -i "/tmp/peek/$s.$kind.jpg" | tr -d '\n'
              echo
              echo "=====END $s.$kind====="
            done
          done
