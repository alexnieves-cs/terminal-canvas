<script>
(()=>{
const root=document.getElementById('tc-next'),screen=root.querySelector('#tc-screen');
const s={page:'mission',phase:'execute',node:1,tab:'activity',decision:false,complete:false,paused:false,reviewed:false,merged:false,release:'idle',mission:'Make checkout resilient',intent:'Make checkout resilient to duplicate requests and flaky payment responses.',budget:'12',autonomy:'Bounded execution',model:'Best fit',memory:0,recipe:0,comment:'',notes:[],created:false,setup:false,connection:'Local only',preview:false};
const design={density:'Comfortable',accent:'#80e3eb',showContext:true};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,primary=false,disabled=false)=>`<button class="tc-btn ${primary?'tc-primary':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
const go=(label,page)=>`<button class="tc-btn tc-quiet" data-go="${page}">${label} →</button>`;
const heading=(eyebrow,title,sub,actions='')=>`<div class="tc-title"><div><div class="tc-kicker">${eyebrow}</div><h1>${esc(title)}</h1><p>${sub}</p></div>${actions}</div>`;
const row=(initial,title,sub,right='')=>`<div class="tc-listrow"><span class="tc-avatar">${initial}</span><div><h3>${title}</h3><p>${sub}</p></div>${right}</div>`;
const notice=t=>root.querySelector('#tc-notice').textContent=t;
const agents=[['01','Map the surface','Architect','Repository map · complete','Found the checkout boundary and three affected callers.','Read-only exploration','contracts/checkout.md'],['02','Payment contract','Backend engineer','Waiting on your decision','A retry may arrive after a payment succeeds. Keep one durable idempotency key per checkout.','Isolated branch · payments','api/payments.ts'],['03','Checkout experience','Frontend engineer','Ready for integration','The retry screen preserves the cart and explains the next step.','Isolated branch · checkout','ui/Checkout.tsx'],['04','Adversarial tests','Test engineer','Waiting for contract','Duplicate requests, timeout recovery, and concurrent submission.','Scratch integration checkout','tests/checkout.spec.ts'],['05','Independent review','Reviewer','Queued after tests','Check assumptions independently against the original acceptance criteria.','Read-only · cannot author changes','review/checkout.md'],['06','Release & observe','Release operator','Requires your approval','Canary the revision, watch payment errors, and keep a rollback ready.','Staging access only','release/checkout.yaml']];
const memories=[['Payment retries keep one key','Architecture decision · ADR-014','Accepted by Alex · 2 days ago','One key identifies a checkout attempt across client retries. A new cart starts a new key.','Used by Backend engineer and Test engineer','docs/adr/014-idempotency.md'],['Never log payment payloads','Repository rule','Imported from AGENTS.md · this revision','Log request IDs and result categories only. Raw payment details must never enter logs or agent context.','Injected into every commerce mission','AGENTS.md · Privacy'],['Checkout performance budget','Acceptance rule','Accepted by Alex · 5 days ago','The checkout shell must render within 1.5 seconds on the agreed mobile profile.','Used by Frontend engineer','docs/performance.md'],['Durable retry retention','Proposed learning','Proposed by Backend engineer · today','Expire idempotency records after 24 hours and retain only the response status and opaque transaction ID.','Awaiting human acceptance','Mission TC-142 · decision 3']];
function stages(){return `<div class="tc-stage" aria-label="Mission phases">${[['plan','01 Plan'],['execute','02 Execute'],['verify','03 Verify'],['release','04 Release']].map(([id,l])=>`<button data-phase="${id}" class="${s.phase===id?'is-active':''}" aria-pressed="${s.phase===id}">${l}</button>`).join('')}</div>`}
function today(){return heading('Wednesday / your briefing','Pick up exactly where you left off.','One mission needs a decision. The rest of your workspace is ready.',btn('Continue mission','continue',true))+`<div class="tc-brief"><h2>Checkout is ready for a contract decision.</h2><p>The frontend lane is ready. The backend agent needs your choice on retry retention before integration tests can proceed.</p></div><div class="tc-columns"><section><div class="tc-sectionhead"><h3>In progress</h3><small class="tc-muted">Commerce platform</small></div>${row('↗',esc(s.mission),s.merged?'Merged · release ready':s.complete?'Evidence ready · review required':'TC-142 · two repositories · bounded execution',go('Open','mission'))}${row('↳','Reduce CI cold starts','Draft · three acceptance criteria',btn('Use draft','draft'))}<div class="tc-section"><h3>Since your last visit</h3>${row('✓','Checkout preview is ready','Frontend engineer · 12 minutes ago',go('Preview','canvas'))}${row('◇','A new learning is proposed','Retry retention · source attached',go('Inspect','memory'))}</div></section><aside><h3>Start with an outcome</h3><p class="tc-muted tc-bottomspace">Describe a change, attach context, and approve the team’s plan.</p><div class="tc-bottomspace">${btn('Write a mission','new')}</div><div class="tc-divider"></div><h3>Connected context</h3><p class="tc-muted tc-bottomspace">commerce-api<br>storefront-web<br>Architecture decisions<br>Repository instructions</p>${go('Manage context','setup')}</aside></div>`}
function mission(){let content=heading('Mission TC-142 / commerce platform',s.mission,s.merged?'Merged revision · ready for a controlled release.':'One outcome. A coordinated team. Evidence at every handoff.',`<span class="tc-status">${s.complete?'Ready to review':s.paused?'Paused':'In progress'}</span>`)+stages();
