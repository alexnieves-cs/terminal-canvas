                  - strong [ref=f4e101]: Skills
                - cell "Reusable procedures the agent can follow and improve" [ref=f4e102]
              - row [ref=f4e103]:
                - cell [ref=f4e104]:
                  - strong [ref=f4e105]: Places
                - cell "Folders you explicitly approve for the agent's work" [ref=f4e106]
              - row [ref=f4e107]:
                - cell [ref=f4e108]:
                  - strong [ref=f4e109]: Chats
                - cell "Separate conversation threads with the same teammate" [ref=f4e110]
          - heading [level=2] [ref=f4e111]:
            - link "Create an Agent" [ref=f4e112] [cursor=pointer]:
              - /url: "#create-an-agent"
            - button "Copy Anchor Link" [ref=f4e113]
          - list [ref=f4e117]:
            - listitem [ref=f4e118]:
              - text: Open
              - strong [ref=f4e119]: Agent
              - text: from the title-bar mode switcher.
            - listitem [ref=f4e120]:
              - text: Select
              - strong [ref=f4e121]: New Agent
              - text: .
            - listitem [ref=f4e122]: Give the teammate a specific name.
            - listitem [ref=f4e123]: Write a brief that defines what it owns and what good work looks like.
            - listitem [ref=f4e124]: Choose an installed engine. Claude Code and Codex support chat; other detected engines can run as terminal sessions.
            - listitem [ref=f4e125]: Save, then start the first chat from the agent's page.
          - paragraph [ref=f4e126]: BridgeMind One does not bundle either engine. Install the corresponding command-line app first so it can be detected on your Mac.
          - paragraph [ref=f4e127]:
            - text: You can also describe the teammate you need and use
            - strong [ref=f4e128]: Create with AI
            - text: to draft its name and brief. Review the result before saving it.
          - heading [level=2] [ref=f4e129]:
            - link "Write a Useful Brief" [ref=f4e130] [cursor=pointer]:
              - /url: "#write-a-useful-brief"
            - button "Copy Anchor Link" [ref=f4e131]
          - paragraph [ref=f4e135]: "A strong brief answers four questions:"
          - list [ref=f4e136]:
            - listitem [ref=f4e137]:
              - strong [ref=f4e138]: What do you own?
              - text: Define the recurring responsibility.
            - listitem [ref=f4e139]:
              - strong [ref=f4e140]: What context matters?
              - text: Name the audience, product, or working style.
            - listitem [ref=f4e141]:
              - strong [ref=f4e142]: What standards apply?
              - text: State quality, tone, safety, and verification expectations.
            - listitem [ref=f4e143]:
              - strong [ref=f4e144]: When should you stop?
              - text: Identify actions that still require builder approval.
          - paragraph [ref=f4e145]: "Example:"
          - blockquote [ref=f4e146]:
            - paragraph [ref=f4e147]: You are our release-notes editor. Turn merged work into concise builder-facing notes. Verify every feature claim against the repository, group changes by outcome, and never publish without approval.
          - heading [level=2] [ref=f4e148]:
            - link "Memory" [ref=f4e149] [cursor=pointer]:
              - /url: "#memory"
            - button "Copy Anchor Link" [ref=f4e150]
          - paragraph [ref=f4e154]: "Memory gives an agent continuity across chats. It is for durable context: preferences, product decisions, recurring constraints, and lessons that should still matter next week."
          - paragraph [ref=f4e155]:
            - text: Use the agent's
            - strong [ref=f4e156]: Memory
            - text: view to inspect what it knows. Correct stale entries when reality changes. Do not use memory as a substitute for task-specific instructions or as a place to store secrets.
          - heading [level=2] [ref=f4e157]:
            - link "Skills" [ref=f4e158] [cursor=pointer]:
              - /url: "#skills"
            - button "Copy Anchor Link" [ref=f4e159]
          - paragraph [ref=f4e163]: Skills capture repeatable procedures. An agent can use them to preserve a workflow it has learned instead of solving the same process from scratch each time.
          - paragraph [ref=f4e164]:
            - text: A useful skill should say when it applies, what steps to follow, what to verify, and when to ask for approval. See
            - strong [ref=f4e165]:
              - link "Skills and Plugins" [ref=f4e166] [cursor=pointer]:
                - /url: /docs/skills-and-plugins
            - text: for the full model.
          - heading [level=2] [ref=f4e167]:
            - link "Places and Authority" [ref=f4e168] [cursor=pointer]:
              - /url: "#places-and-authority"
            - button "Copy Anchor Link" [ref=f4e169]
          - paragraph [ref=f4e173]:
            - text: An agent works from its own home and can be granted additional folders through
            - strong [ref=f4e174]: Places
            - text: . Grant only the folders the teammate needs.
          - paragraph [ref=f4e175]: Plugins, agent messaging, and routine scheduling are separate permissions. Keeping them explicit limits the effect of a mistaken instruction and makes each teammate's authority easier to understand.
          - heading [level=2] [ref=f4e176]:
            - link "Agent Chats" [ref=f4e177] [cursor=pointer]:
              - /url: "#agent-chats"
            - button "Copy Anchor Link" [ref=f4e178]
          - paragraph [ref=f4e182]: Each chat is a thread with the same agent identity. Start a new chat when the goal changes materially; keep an existing chat when the next request depends on its recent discussion.
          - paragraph [ref=f4e183]: When agent messaging is enabled, approved teammates can send each other bounded messages. The exchange appears in both agents' chats and can wake an idle teammate into a fresh chat, subject to the app's safety limits.
          - heading [level=2] [ref=f4e184]:
            - link "Agent Settings" [ref=f4e185] [cursor=pointer]:
              - /url: "#agent-settings"
            - button "Copy Anchor Link" [ref=f4e186]
          - paragraph [ref=f4e190]:
            - text: From an agent's
            - strong [ref=f4e191]: Settings
            - text: "view, you can:"
          - list [ref=f4e192]:
            - listitem [ref=f4e193]: Update its name and brief
            - listitem [ref=f4e194]: Change the default engine and conversation settings
            - listitem [ref=f4e195]: Manage approved places
            - listitem [ref=f4e196]: Choose a memory budget and reflection mode
            - listitem [ref=f4e197]: Enable or disable messaging and routine permissions
            - listitem [ref=f4e198]: Delete the agent after reviewing the confirmation
          - paragraph [ref=f4e199]: Changing an engine affects future work. Review active chats before switching so you understand which context carries forward.
