        - generic [ref=f4e68]:
          - heading "Agent Mode" [level=1] [ref=f4e69]
          - paragraph [ref=f4e70]: Create persistent AI teammates with a brief, durable memory, reusable skills, ongoing chats, and access you control.
          - paragraph [ref=f4e71]:
            - text: Agent Mode organizes work around
            - strong [ref=f4e72]: persistent AI teammates
            - text: . Each agent has a role, its own history and working context, and the ability to improve how it handles repeated work.
          - paragraph [ref=f4e73]: The agent is the teammate. Claude Code or Codex can power its chats, but the engine does not define the teammate's role.
          - heading [level=2] [ref=f4e74]:
            - link "What an Agent Contains" [ref=f4e75] [cursor=pointer]:
              - /url: "#what-an-agent-contains"
            - button "Copy Anchor Link" [ref=f4e76]
          - table [ref=f4e81]:
            - rowgroup [ref=f4e82]:
              - row [ref=f4e83]:
                - columnheader "Part" [ref=f4e84]
                - columnheader "Purpose" [ref=f4e85]
            - rowgroup [ref=f4e86]:
              - row [ref=f4e87]:
                - cell [ref=f4e88]:
                  - strong [ref=f4e89]: Name
                - cell "A recognizable identity in your roster" [ref=f4e90]
              - row [ref=f4e91]:
                - cell [ref=f4e92]:
                  - strong [ref=f4e93]: Brief
                - cell "The job, standards, tone, and boundaries you define" [ref=f4e94]
              - row [ref=f4e95]:
                - cell [ref=f4e96]:
                  - strong [ref=f4e97]: Memory
                - cell "Durable facts and context the agent records for future work" [ref=f4e98]
              - row [ref=f4e99]:
