      - article [ref=f6e67]:
        - generic [ref=f6e68]:
          - heading "Skills and Plugins" [level=1] [ref=f6e69]
          - paragraph [ref=f6e70]: Give BridgeMind One agents reusable procedures and controlled access to connected services while credentials remain managed by the app.
          - paragraph [ref=f6e71]:
            - text: Skills tell an agent
            - strong [ref=f6e72]: how to repeat a process
            - text: . Plugins let an agent
            - strong [ref=f6e73]: act through a connected service
            - text: . Together they turn a general-purpose teammate into one that understands your workflow and can reach the systems you approve.
          - heading [level=2] [ref=f6e74]:
            - link "Skills" [ref=f6e75] [cursor=pointer]:
              - /url: "#skills"
            - button "Copy Anchor Link" [ref=f6e76]
          - paragraph [ref=f6e80]: A skill is a reusable set of instructions for a specific kind of work. It should define when it applies, the process to follow, the checks to run, and the conditions that require builder approval.
          - paragraph [ref=f6e81]: BridgeMind One includes a starter library. Installing a skill adds it to an agent's available procedures. Agents can also author or refine skills as they learn a repeatable workflow.
          - heading [level=3] [ref=f6e82]:
            - link "What makes a good skill?" [ref=f6e83] [cursor=pointer]:
              - /url: "#what-makes-a-good-skill"
            - button "Copy Anchor Link" [ref=f6e84]
          - list [ref=f6e88]:
            - listitem [ref=f6e89]:
              - strong [ref=f6e90]: Narrow trigger
              - text: — It is clear when the skill should be used.
            - listitem [ref=f6e91]:
              - strong [ref=f6e92]: Concrete procedure
              - text: — The steps are specific enough to repeat.
            - listitem [ref=f6e93]:
              - strong [ref=f6e94]: Verification
              - text: — The skill defines how to know the work succeeded.
            - listitem [ref=f6e95]:
              - strong [ref=f6e96]: Safety boundary
              - text: — Publishing, spending, deletion, and other sensitive actions remain explicit.
            - listitem [ref=f6e97]:
              - strong [ref=f6e98]: Maintainability
              - text: — The procedure can be corrected when the underlying system changes.
          - heading [level=3] [ref=f6e99]:
            - link "Manage skills" [ref=f6e100] [cursor=pointer]:
              - /url: "#manage-skills"
            - button "Copy Anchor Link" [ref=f6e101]
          - list [ref=f6e105]:
            - listitem [ref=f6e106]:
              - text: Open
              - strong [ref=f6e107]: Skills
              - text: in the sidebar.
            - listitem [ref=f6e108]: Review the starter library.
            - listitem [ref=f6e109]: Install the relevant skill for an agent.
            - listitem [ref=f6e110]:
              - text: Open that agent's
              - strong [ref=f6e111]: Skills
              - text: view to inspect its available procedures.
            - listitem [ref=f6e112]: Edit or remove a skill when its instructions no longer match reality.
          - paragraph [ref=f6e113]: Do not store credentials in a skill. A skill is instruction content, not a secret store.
          - heading [level=2] [ref=f6e114]:
            - link "Plugins" [ref=f6e115] [cursor=pointer]:
              - /url: "#plugins"
            - button "Copy Anchor Link" [ref=f6e116]
          - paragraph [ref=f6e120]: Plugins connect BridgeMind One to external services through app-managed authorization. An agent sees only the capabilities you enable; credentials remain managed by the app rather than being copied into prompts or chat history.
          - paragraph [ref=f6e121]: The catalog can include development, business, communication, research, media, and growth services. Current examples include GitHub, Linear, Stripe, Cloudflare, Gmail, Supabase, Vercel, Shopify, Slack, Notion, Apollo, Higgsfield, fal, vidIQ, RevenueCat, Google Ads, and Meta Ads.
          - paragraph [ref=f6e122]: "Availability varies by service. The status shown in the Plugins screen is authoritative: some connections are ready to configure, while preview entries cannot be connected yet."
          - heading [level=2] [ref=f6e123]:
            - link "Connect a Service" [ref=f6e124] [cursor=pointer]:
              - /url: "#connect-a-service"
            - button "Copy Anchor Link" [ref=f6e125]
          - list [ref=f6e129]:
            - listitem [ref=f6e130]:
              - text: Open
              - strong [ref=f6e131]: Plugins
              - text: in the sidebar.
            - listitem [ref=f6e132]: Select a service.
            - listitem [ref=f6e133]:
              - text: Choose
              - strong [ref=f6e134]: Connect
              - text: .
            - listitem [ref=f6e135]: Complete the browser authorization or enter the requested service key.
            - listitem [ref=f6e136]: Review the connected account shown by BridgeMind One.
            - listitem [ref=f6e137]: Enable the plugin only for agents that need it.
          - paragraph [ref=f6e138]: If verification fails, the existing connection remains unchanged. Disconnect a service from the same page when an agent should no longer have access.
          - heading [level=2] [ref=f6e139]:
            - link "Approvals and Spending" [ref=f6e140] [cursor=pointer]:
              - /url: "#approvals-and-spending"
            - button "Copy Anchor Link" [ref=f6e141]
          - paragraph [ref=f6e145]: Read-only actions can run without interruption when the plugin policy allows them. Sensitive writes, purchases, budget changes, data enrichment, and other credit-consuming actions can pause for an approval card.
          - paragraph [ref=f6e146]: "Before approving, review:"
          - list [ref=f6e147]:
            - listitem [ref=f6e148]: The service and connected account
            - listitem [ref=f6e149]: The action the agent wants to perform
            - listitem [ref=f6e150]: The target resource
            - listitem [ref=f6e151]: Any stated cost, budget, or credit use
          - paragraph [ref=f6e152]: An instruction in a prompt is not a substitute for authorization. Keep high-impact capabilities disabled unless the teammate genuinely needs them.
          - heading [level=2] [ref=f6e153]:
            - link "Scope Plugins Per Agent" [ref=f6e154] [cursor=pointer]:
              - /url: "#scope-plugins-per-agent"
            - button "Copy Anchor Link" [ref=f6e155]
          - paragraph [ref=f6e159]: Connection and agent permission are separate decisions. Connecting a service makes it available to BridgeMind One; enabling it for an agent gives that teammate access to its approved capabilities.
          - paragraph [ref=f6e160]: Use the smallest useful scope. A research agent may need read access to one service, while an operations agent may need a controlled write action in another.
        - generic [ref=f6e161]:
