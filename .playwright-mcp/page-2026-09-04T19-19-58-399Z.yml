          - heading "Routines" [level=1] [ref=f5e69]
          - paragraph [ref=f5e70]: Schedule a BridgeMind One agent to start repeatable work in a fresh chat while the app is running.
          - paragraph [ref=f5e71]: Routines schedule a BridgeMind One agent to start repeatable work. Each run opens a fresh chat with the selected teammate, preserving the result without mixing it into an unrelated conversation.
          - paragraph [ref=f5e77]: Routines run only while BridgeMind One is open. They are not a background service and should not be used for safety-critical or exact-time automation.
          - heading [level=2] [ref=f5e78]:
            - link "Create a Routine" [ref=f5e79] [cursor=pointer]:
              - /url: "#create-a-routine"
            - button "Copy Anchor Link" [ref=f5e80]
          - list [ref=f5e84]:
            - listitem [ref=f5e85]:
              - text: Open
              - strong [ref=f5e86]: Routines
              - text: in the sidebar.
            - listitem [ref=f5e87]:
              - text: Select
              - strong [ref=f5e88]: New Routine
              - text: .
            - listitem [ref=f5e89]: Choose the agent responsible for the work.
            - listitem [ref=f5e90]: Name the routine.
            - listitem [ref=f5e91]: Write the instruction the agent should receive on every run.
            - listitem [ref=f5e92]: Choose the schedule.
            - listitem [ref=f5e93]: Review the next run time and save.
          - paragraph [ref=f5e94]: The selected agent must allow routine scheduling in its settings.
          - heading [level=2] [ref=f5e95]:
            - link "Write the Instruction" [ref=f5e96] [cursor=pointer]:
              - /url: "#write-the-instruction"
            - button "Copy Anchor Link" [ref=f5e97]
          - paragraph [ref=f5e101]: "A routine prompt should be complete without relying on the previous run. Include:"
          - list [ref=f5e102]:
            - listitem [ref=f5e103]: The outcome to produce
            - listitem [ref=f5e104]: The source of truth to inspect
            - listitem [ref=f5e105]: The time window or scope
            - listitem [ref=f5e106]: The expected output format
            - listitem [ref=f5e107]: The actions that still require approval
          - paragraph [ref=f5e108]: "Example:"
          - blockquote [ref=f5e109]:
            - paragraph [ref=f5e110]: Review this week's merged work, group it by builder outcome, draft concise release notes, link each claim to its source, and leave the draft in the chat for approval. Do not publish it.
          - heading [level=2] [ref=f5e111]:
            - link "Schedule Options" [ref=f5e112] [cursor=pointer]:
              - /url: "#schedule-options"
            - button "Copy Anchor Link" [ref=f5e113]
          - paragraph [ref=f5e117]: Routines support recurring schedules such as daily or weekly work and interval-based repetition. The routine form shows the resolved schedule and next expected run before you save.
          - paragraph [ref=f5e118]: Keep local time changes in mind when scheduling around daylight-saving transitions or travel.
          - heading [level=2] [ref=f5e119]:
            - link "Manage a Routine" [ref=f5e120] [cursor=pointer]:
              - /url: "#manage-a-routine"
            - button "Copy Anchor Link" [ref=f5e121]
          - paragraph [ref=f5e125]: "From the Routines list, you can:"
          - list [ref=f5e126]:
            - listitem [ref=f5e127]:
              - strong [ref=f5e128]: Run now
              - text: to start the work immediately
            - listitem [ref=f5e129]:
              - strong [ref=f5e130]: Pause
              - text: future scheduled runs
            - listitem [ref=f5e131]:
              - strong [ref=f5e132]: Resume
              - text: a paused routine
            - listitem [ref=f5e133]:
              - strong [ref=f5e134]: Edit
              - text: its agent, instruction, or schedule
            - listitem [ref=f5e135]:
              - strong [ref=f5e136]: Open last
              - text: when a completed run has a chat
            - listitem [ref=f5e137]:
              - strong [ref=f5e138]: Delete
              - text: the schedule without treating prior chats as disposable
          - paragraph [ref=f5e139]: Errors appear on the routine row so you can correct the instruction, engine, connection, or agent permission before resuming it.
          - heading [level=2] [ref=f5e140]:
            - link "How Runs Behave" [ref=f5e141] [cursor=pointer]:
              - /url: "#how-runs-behave"
            - button "Copy Anchor Link" [ref=f5e142]
          - list [ref=f5e146]:
            - listitem [ref=f5e147]: Every run starts a fresh agent chat.
            - listitem [ref=f5e148]: A paused routine does not start scheduled work.
            - listitem [ref=f5e149]: A missing agent or unavailable engine prevents that run from completing.
            - listitem [ref=f5e150]: Closing BridgeMind One stops the in-app scheduler.
            - listitem [ref=f5e151]: Reopening the app resumes future schedule checks; it does not make an exact-time guarantee for work missed while the app was closed.
          - heading [level=2] [ref=f5e152]:
            - link "Safe Routine Design" [ref=f5e153] [cursor=pointer]:
              - /url: "#safe-routine-design"
            - button "Copy Anchor Link" [ref=f5e154]
          - paragraph [ref=f5e158]: Prefer routines that gather, analyze, draft, or prepare work for review. Keep irreversible actions behind a builder confirmation.
          - paragraph [ref=f5e159]: "Good routine outcomes include:"
          - list [ref=f5e160]:
            - listitem [ref=f5e161]: A morning project summary
            - listitem [ref=f5e162]: A draft weekly update
            - listitem [ref=f5e163]: A dependency or repository health review
            - listitem [ref=f5e164]: A prepared research brief
            - listitem [ref=f5e165]: A queue of recommended follow-up actions
          - paragraph [ref=f5e166]: Avoid unattended instructions that publish externally, delete data, transfer money, or make open-ended changes without a bounded target.
