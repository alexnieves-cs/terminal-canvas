    - generic [ref=e64]:
      - heading "What has to stay" [level=2] [ref=e65]
      - paragraph [ref=e66]: The repository pins several visual facts with checks or with hard constraints, and a redesign that ignores them fails silently in the build or in a screenshot nobody was looking at. Every direction below is drawn inside these.
    - generic [ref=e67]:
      - generic [ref=e68]:
        - generic [ref=e69]: One hue per state, everywhere
        - text: Blue working, amber needs-you, green idle, red exited, grey not-started, dashed asleep. A direction may re-tune the hues; it may not repurpose one. Contrast is checked at 3:1 on two surfaces by verify:styles 11.
      - generic [ref=e70]:
        - generic [ref=e71]: One interface accent, not an agent colour
        - text: Selection, focus rings and links share one accent. Blue is reserved for "working", so the accent cannot be blue. Cyan, violet, periwinkle and teal are all open.
      - generic [ref=e72]:
        - generic [ref=e73]: Theme token parity
        - text: Both theme blocks must declare exactly the same token names or the build fails. Any new token (a glow, a glass fill, a highlight) is added to both themes at once.
      - generic [ref=e74]:
        - generic [ref=e75]: The amber literal and the well
        - text: The amber must stay a literal colour and the well must equal the xterm theme's background byte for byte. Two checks compare resolved values.
      - generic [ref=e76]:
        - generic [ref=e77]: No remote fonts, by CSP
        - text: The renderer forbids remote assets. A distinctive typeface has to be bundled with the app, which the brief declined once. It is a real decision, so it is a question below rather than an assumption.
      - generic [ref=e78]:
        - generic [ref=e79]: Structural tokens outside theme blocks
        - text: Radius, spacing and motion live in the structural block. Rounder corners or a slower ease are one-line changes; they must not be introduced per theme.
