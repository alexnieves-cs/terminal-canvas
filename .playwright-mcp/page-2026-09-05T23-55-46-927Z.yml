    - generic [ref=e16]:
      - heading "What it is now" [level=2] [ref=e17]
      - paragraph [ref=e18]: "Two real frames from the M61 screenshot harness. The design is disciplined: an eight-step spacing scale, a six-step type scale, one accent (iris), one hue per agent state, hairline boundaries, and a \"quiet instrument\" brief that every milestone since M62 has been judged against. That discipline is the asset. It is also why it looks like a lab bench and not a flagship product."
    - generic [ref=e19]:
      - figure "Light theme, the overview fixture. Flat grey ground, white panels with a hairline, the one amber panel is the only thing that pulls the eye." [ref=e20]:
        - 'img "The light theme: a canvas with a chat panel, terminal panels and a review panel, the panels rail on the left and a needs-you panel in amber" [ref=e21]'
      - figure "Dark theme, every panel kind. Every card sits at the same depth, so the eye has no order to follow." [ref=e23]:
        - 'img "The dark theme: nine panel kinds arranged on the canvas, each a flat charcoal card with a hairline border" [ref=e24]'
  - generic [ref=e26]:
    - generic [ref=e27]:
      - heading "Why it does not feel premium yet" [level=2] [ref=e28]
      - paragraph [ref=e29]: "Premium is mostly a depth story and a light story. This interface has neither: every surface sits at the same distance from the viewer and nothing in it appears to be lit. The specific gaps, each with where to see it."
    - generic [ref=e30]:
      - generic [ref=e31]:
        - heading "Everything is one layer deep" [level=3] [ref=e32]
        - paragraph [ref=e33]: The ground, the chrome, the panels and the palette are separated only by a 1px line and a two-step change in lightness. A raised palette casts a shadow, but a panel, a rail and the top bar are the same plane. The eye has no way to order the scene.
        - generic [ref=e34]: "--s-0 #0e1015 Â· --s-1 #171a21 Â· --s-2 #1b1f27 â€” a 6 to 10 point spread"
      - generic [ref=e35]:
        - heading "The chrome is grey on grey" [level=3] [ref=e36]
        - paragraph [ref=e37]: Dock icons, the rail's section heading, the strip's meta text and disabled rows are all rendered in the same mid grey. Nothing in the chrome has a material. Premium interfaces give chrome a faint inner light, a tint or a translucency so it reads as a physical thing the content sits inside.
        - generic [ref=e38]: dock, PANELS heading, "hints fade once you have used them"
      - generic [ref=e39]:
        - heading "The state edge is a stripe, not a signal" [level=3] [ref=e40]
        - paragraph [ref=e41]: The 3px left edge is the app's one signature mark and it is flat paint. A "needs you" panel should feel like it is emitting something. A soft glow in the state hue turns the same mark into the futuristic cue you are asking for, with no new vocabulary.
