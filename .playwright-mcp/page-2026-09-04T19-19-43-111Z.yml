          - heading "Code Mode" [level=1] [ref=f3e69]
          - paragraph [ref=f3e70]: Work by project folder with real terminals, coding-agent threads, files, browsers, simulators, tabs, splits, and multi-agent session presets.
          - paragraph [ref=f3e71]:
            - text: Code Mode organizes work around a
            - strong [ref=f3e72]: project folder
            - text: . It combines the surfaces a builder needs to inspect, change, run, and verify software without scattering the task across unrelated windows.
          - heading [level=2] [ref=f3e73]:
            - link "Add a Workspace" [ref=f3e74] [cursor=pointer]:
              - /url: "#add-a-workspace"
