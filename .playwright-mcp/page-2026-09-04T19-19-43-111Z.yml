              - strong [ref=f3e81]: Code
              - text: in the title bar.
            - listitem [ref=f3e82]: Add a folder from the workspace rail.
            - listitem [ref=f3e83]: Select the workspace.
            - listitem [ref=f3e84]: Start a terminal, agent thread, browser, file pane, or simulator from the pane menu.
          - paragraph [ref=f3e85]: BridgeMind One keeps workspace tabs and live sessions available as you move between modes.
          - heading [level=2] [ref=f3e86]:
            - link "Pane Types" [ref=f3e87] [cursor=pointer]:
