                  - strong [ref=f3e105]: Thread
                - cell "A conversation-style coding-agent session scoped to the workspace" [ref=f3e106]
              - row [ref=f3e107]:
                - cell [ref=f3e108]:
                  - strong [ref=f3e109]: Files
                - cell "Browse and edit files in the selected project" [ref=f3e110]
              - row [ref=f3e111]:
                - cell [ref=f3e112]:
                  - strong [ref=f3e113]: Browser
                - cell "Inspect a local or remote web surface alongside the code" [ref=f3e114]
              - row [ref=f3e115]:
                - cell [ref=f3e116]:
                  - strong [ref=f3e117]: Simulator
                - cell "Interact with an available iOS Simulator inside the workspace" [ref=f3e118]
          - paragraph [ref=f3e119]: Panes can be split, stacked, tabbed, resized, rearranged, and closed. Drag a pane header to move it or use a snap layout to reorganize a busy workspace.
          - heading [level=2] [ref=f3e120]:
            - link "Start a Coding Agent" [ref=f3e121] [cursor=pointer]:
              - /url: "#start-a-coding-agent"
            - button "Copy Anchor Link" [ref=f3e122]
          - paragraph [ref=f3e126]: BridgeMind One checks which supported third-party coding-agent command-line apps are installed and prioritizes those choices. It does not bundle the agents.
          - paragraph [ref=f3e127]: Available tools can include Claude Code, Codex, Cursor Agent, Gemini CLI, GitHub Copilot, and others. Only choices detected in your normal login shell are ready to start.
          - paragraph [ref=f3e128]: "You can start one session directly or use a preset:"
          - table [ref=f3e130]:
            - rowgroup [ref=f3e131]:
              - row [ref=f3e132]:
                - columnheader "Preset" [ref=f3e133]
                - columnheader "Shape" [ref=f3e134]
            - rowgroup [ref=f3e135]:
              - row [ref=f3e136]:
                - cell [ref=f3e137]:
                  - strong [ref=f3e138]: Solo
                - cell "One focused session" [ref=f3e139]
              - row [ref=f3e140]:
                - cell [ref=f3e141]:
                  - strong [ref=f3e142]: Pair
                - cell "Two complementary sessions" [ref=f3e143]
              - row [ref=f3e144]:
                - cell [ref=f3e145]:
                  - strong [ref=f3e146]: Workbench
                - cell "A compact multi-session setup" [ref=f3e147]
              - row [ref=f3e148]:
                - cell [ref=f3e149]:
                  - strong [ref=f3e150]: Swarm
                - cell "Several parallel sessions with distinct roles" [ref=f3e151]
          - paragraph [ref=f3e152]: Before starting, the lineup shows how many sessions will open and the role assigned to each one. Review it before committing resources.
          - heading [level=2] [ref=f3e153]:
            - link "Terminal Sessions" [ref=f3e154] [cursor=pointer]:
              - /url: "#terminal-sessions"
            - button "Copy Anchor Link" [ref=f3e155]
          - paragraph [ref=f3e159]: Terminal panes are real interactive shell sessions. They support full-screen terminal apps, persistent session tabs, command history, search, and file drops.
          - paragraph [ref=f3e160]: Drop a file or folder onto a terminal to insert a safely quoted path at the caret.
          - heading [level=2] [ref=f3e161]:
            - link "Agent Threads" [ref=f3e162] [cursor=pointer]:
              - /url: "#agent-threads"
            - button "Copy Anchor Link" [ref=f3e163]
          - paragraph [ref=f3e167]: A Thread pane presents a coding agent as a conversation while keeping it scoped to the current workspace. Chat-style Thread adapters are available for Claude Code and Codex; other detected agents run in terminal panes.
          - paragraph [ref=f3e168]: Thread composers support file and image attachments, workspace file mentions, model and work-mode controls, and stopping an active turn.
          - paragraph [ref=f3e174]: A Code thread belongs to a project and can act in that workspace. A Chat Mode conversation has no project folder, while an Agent Mode chat belongs to a persistent teammate.
          - heading [level=2] [ref=f3e175]:
            - link "Browsers, Files, and Simulators" [ref=f3e176] [cursor=pointer]:
              - /url: "#browsers-files-and-simulators"
            - button "Copy Anchor Link" [ref=f3e177]
          - list [ref=f3e181]:
            - listitem [ref=f3e182]:
              - text: Open a
              - strong [ref=f3e183]: Browser
              - text: beside a development server to verify the result where it runs.
            - listitem [ref=f3e184]:
              - text: Open
              - strong [ref=f3e185]: Files
              - text: to inspect or edit project content without leaving the workspace.
            - listitem [ref=f3e186]:
              - text: Open a
              - strong [ref=f3e187]: Simulator
              - text: when the required local tools and an iOS Simulator are available.
          - paragraph [ref=f3e188]: These panes share the same layout system as terminals and threads, so you can keep implementation and evidence together.
          - heading [level=2] [ref=f3e189]:
            - link "Command Bar" [ref=f3e190] [cursor=pointer]:
              - /url: "#command-bar"
            - button "Copy Anchor Link" [ref=f3e191]
          - paragraph [ref=f3e195]: When a session is active, the command bar sends your prompt to that session. When nothing is running, it can start a supported coding agent with the prompt.
          - paragraph [ref=f3e196]: Give the agent a bounded objective and ask it to run the relevant checks. Keep publishing, destructive changes, spending, and other external actions behind explicit approval.
