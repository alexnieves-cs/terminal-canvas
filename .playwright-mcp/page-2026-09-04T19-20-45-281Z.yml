            - heading [level=3] [ref=f12e123]:
              - link "Chat mode becomes threads in your workspaces, and Bridge can find any session" [ref=f12e124] [cursor=pointer]:
                - /url: /changelog/bridgemind-one/v0-1-25
            - paragraph [ref=f12e125]: Windows and Linux. Chat mode is now organised as threads inside your workspace folders, the way T3 Code works, with Cursor, Grok Build and OpenCode joining Claude Code and Codex as thread engines through the Agent Client Protocol. Ask Bridge where an agent is working and it takes you there. A failed update now says so and offers a retry or a direct installer download instead of silently showing "Update" again.
            - list [ref=f12e126]:
              - listitem [ref=f12e127]:
                - generic [ref=f12e128]: Threads live in your folders.
                - text: The Chat sidebar lists your workspace folders with one thread per coding session underneath. Start a new thread from a folder's +, the header's +, or Ctrl+N; each thread's header names its folder, branch, engine and model, and a Changes panel shows a unified diff per changed file.
              - listitem [ref=f12e129]:
                - generic [ref=f12e130]: Bridge finds the session.
                - text: Ask "where is the agent working on the login tests?" and Bridge locates it — a terminal pane, a saved agent's chat or a Chat-mode thread — takes you there, highlights it, and tells you what it was last doing.
              - listitem [ref=f12e131]:
                - generic [ref=f12e132]: A stuck update tells you.
                - text: When an update downloads but the installer cannot start, the title-bar pill reports the failure with a retry, and Settings › Software update offers a Download installer button that opens the signed Windows installer in your browser.
            - generic [ref=f12e133]:
              - paragraph [ref=f12e134]: Added
