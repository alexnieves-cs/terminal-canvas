          - paragraph [ref=f12e283]: BridgeSpace 3.4.15 confirms the account before browser sign-in returns to the desktop. It also keeps paid workspaces available through token refreshes and stale browser cookies.
          - list [ref=f12e284]:
            - listitem [ref=f12e285]:
              - generic [ref=f12e286]: Confirm the account first.
              - text: Browser sign-in now shows the account before BridgeSpace accepts it, with a direct path to switch accounts.
            - listitem [ref=f12e287]:
              - generic [ref=f12e288]: Subscription checks recover.
              - text: Paid workspaces no longer fall into an upgrade screen when a startup verification is replayed or delayed.
            - listitem [ref=f12e289]:
              - generic [ref=f12e290]: Desktop sessions stay signed in.
              - text: Refresh timing, per-session logout, and stale cookie handling no longer invalidate unrelated desktop sessions.
          - generic [ref=f12e291]:
            - paragraph [ref=f12e292]: Fixed
            - list [ref=f12e293]:
              - listitem [ref=f12e294]: Browser OAuth confirms the resolved account before handing credentials to BridgeSpace and lets builders restart with a different account.
              - listitem [ref=f12e295]: Upgrade prompts name the signed-in account so a subscription tied to another login is immediately visible.
              - listitem [ref=f12e296]: Bearer-authenticated desktop requests ignore stale web-session cookies instead of failing write requests at CSRF validation.
              - listitem [ref=f12e297]: Web logout revokes only the current web session instead of signing BridgeSpace out on another device.
              - listitem [ref=f12e298]: Access-token refresh uses the token's real lifetime, the correct Cognito client, and a forced retry after an API rejection.
        - article [ref=f12e299]:
          - generic [ref=f12e300]:
            - generic [ref=f12e301]: v3.4.13
            - generic [ref=f12e302]: 2026-07-12
          - heading [level=3] [ref=f12e303]:
            - link "Startup recovery that stops looping" [ref=f12e304] [cursor=pointer]:
              - /url: /changelog/bridgespace/v3-4-13
          - paragraph [ref=f12e305]: BridgeSpace 3.4.13 keeps Windows terminal failures, subscription checks, and agent resumes from turning into startup loops. Failed work stays visible, recovery stays explicit, and existing terminal layouts remain intact.
          - list [ref=f12e306]:
            - listitem [ref=f12e307]:
              - generic [ref=f12e308]: Windows terminals recover in place.
              - text: Blocked shell aliases now fall back to real PowerShell or Command Prompt executables, while large restored layouts pause excess terminals without deleting their panes.
            - listitem [ref=f12e309]:
              - generic [ref=f12e310]: Subscription checks always finish.
              - text: Verification now has a hard deadline. Temporary failures show Retry and Sign in again, while invalid credentials return directly to authentication.
            - listitem [ref=f12e311]:
              - generic [ref=f12e312]: Agent resumes return to their pane.
              - text: Recovered Claude and Codex sessions now use durable workspace and pane identity, so a restart restores the conversation where it actually ran.
          - generic [ref=f12e313]:
            - paragraph [ref=f12e314]: Changed
            - list [ref=f12e315]:
              - listitem [ref=f12e316]: Deferred terminal panes keep their original split, folder, SSH context, and bound-agent actions until a builder chooses how to restore them.
          - generic [ref=f12e317]:
            - paragraph [ref=f12e318]: Fixed
            - list [ref=f12e319]:
              - listitem [ref=f12e320]: Windows System Default skips blocked WindowsApps shell aliases and retries canonical PowerShell and Command Prompt executables for recoverable CreateProcessW failures.
              - listitem [ref=f12e321]: Cold-start terminal restore uses a bounded budget and circuit breaker instead of recreating every persisted PTY at once after a crash.
              - listitem [ref=f12e322]: Subscription verification cannot spin forever, cannot grant paid access from cache, and cannot apply a late result from a previous account.
              - listitem [ref=f12e323]: Agent sessions persist workspace and pane identity so relaunch recovery, History resume, account-limit switching, and BridgeSwarm launches target the original pane.
              - listitem [ref=f12e324]: Claude Code mouse selections copy the text inside prompt boxes without border glyphs or padded cells, while deliberate box-art copies remain unchanged.
