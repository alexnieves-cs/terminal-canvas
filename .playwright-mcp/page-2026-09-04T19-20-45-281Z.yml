            - heading [level=3] [ref=f12e77]:
              - 'link "The Windows terminal behaves: PowerShell opens, splits reflow, Shift+Enter adds a line" [ref=f12e78] [cursor=pointer]':
                - /url: /changelog/bridgemind-one/v0-1-28
            - paragraph [ref=f12e79]: Windows only. Every terminal fix from the Windows beta tickets in one update. Choosing PowerShell opens a working prompt instead of failing on the spot, Shift+Enter inside Claude Code inserts a new line rather than sending the prompt, and split panes stop painting a coding agent's screen twice or leaving it drawn in the old corner after you close its neighbour. Ctrl+V pastes into a terminal again.
            - list [ref=f12e80]:
              - listitem [ref=f12e81]:
                - generic [ref=f12e82]: PowerShell opens again.
                - text: Settings › Terminal › PowerShell now opens a live prompt. When any chosen shell cannot start, the pane names the executable it tried instead of a generic start error.
              - listitem [ref=f12e83]:
                - generic [ref=f12e84]: Splits reflow like Windows Terminal.
                - text: Splitting, pressing +, maximizing and restoring, or closing one of two panes now hands the remaining agent the full grid at once — no duplicate frame, no dropped lines, no agent stuck in a corner until you resize by hand.
              - listitem [ref=f12e85]:
                - generic [ref=f12e86]: Shift+Enter is a new line.
                - text: In a terminal running Claude Code, Shift+Enter inserts a line break the way it does in the Claude Code CLI; Enter still submits.
            - generic [ref=f12e87]:
              - paragraph [ref=f12e88]: Fixed
              - list [ref=f12e89]:
                - listitem [ref=f12e90]: Choosing PowerShell as the terminal type now opens a working PowerShell pane instead of failing immediately.
                - listitem [ref=f12e91]: When a chosen shell cannot be launched, the terminal pane names the executable it tried instead of a generic start error.
                - listitem [ref=f12e92]: Shift+Enter in a terminal running Claude Code inserts a new line instead of submitting the prompt.
                - listitem [ref=f12e93]: Splitting a pane, pressing "+", or maximizing and restoring the window no longer paints a coding agent's screen twice, drops lines, or leaves a garbled copy behind; the terminal now follows Windows' own resize behaviour.
                - listitem [ref=f12e94]: Closing one of two terminal panes reflows the remaining agent to the full pane immediately, instead of leaving it drawn in the old corner until the pane is resized by hand.
                - listitem [ref=f12e95]: Ctrl+V and Shift+Insert paste into a terminal again instead of sending a control character to the running agent.
