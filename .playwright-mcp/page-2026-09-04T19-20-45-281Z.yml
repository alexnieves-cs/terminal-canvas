            - paragraph [ref=f12e553]: Fixed
            - list [ref=f12e554]:
              - listitem [ref=f12e555]: A paying builder whose token refresh failed transiently saw "Pro subscription required" on every shortcut press until the background refresher recovered. The recording gate now stays open while the session is merely expired with a valid refresh token and the cached subscription is inside its paid period; each press also doubles as a recovery attempt.
              - listitem [ref=f12e556]: "Windows: focus restore failures (the \"paste manually\" fallback) now retry once after a benign Alt tap that lifts the foreground lock — the same escalation AutoHotkey uses — and remaining failures are tagged with the refusing app so they can be fixed per-target."
              - listitem [ref=f12e557]: "macOS: hotkey dispatch moved off the event-tap callback onto a worker thread, so showing windows or emitting events can no longer stall the tap into a system-disabled state mid-hold."
              - listitem [ref=f12e558]: "Startup: the Whisper model probe hashes candidate files on the blocking pool and no longer holds the model-manager lock, so other commands aren't blocked while models verify."
              - listitem [ref=f12e559]: "Recording start latency: the post-start capture probe no longer adds 25-50 ms of perceived delay on healthy recordings."
