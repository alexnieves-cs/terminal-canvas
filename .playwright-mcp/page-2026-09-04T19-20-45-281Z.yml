            - paragraph [ref=f12e163]: macOS only. Bridge and dictation now keep the microphone you had before your Bluetooth headphones connected, instead of quietly switching to an iPhone's Continuity Camera mic or another display's mic that hears nothing. A mic that opens but delivers no audio says so. Muse Code by Meta joins the coding agents you can launch in a pane.
