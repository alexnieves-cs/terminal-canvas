          - paragraph [ref=f12e418]: BridgeVoice 2.8.4 stops Whisper's conversational trail-off from being pasted when a recording ends mid-sentence — on every engine, local and cloud — and gives update failures from a mounted DMG a clear, actionable fix.
          - list [ref=f12e419]:
            - listitem [ref=f12e420]:
              - generic [ref=f12e421]: Trailing ellipses stripped from dictation.
              - text: Stopping a recording to think no longer appends "..." — Whisper's trail-off on incomplete sentences is stripped on local models and cloud transcription alike, while real terminal punctuation is preserved.
            - listitem [ref=f12e422]:
              - generic [ref=f12e423]: Cross-volume update failures now explain the fix.
              - text: Updating while running from a mounted DMG showed a generic "Update failed" toast that vanished mid-read; it is now a sticky message telling builders to move BridgeVoice to Applications first.
          - generic [ref=f12e424]:
            - paragraph [ref=f12e425]: Fixed
            - list [ref=f12e426]:
              - listitem [ref=f12e427]: "Transcripts no longer end with hallucinated \"...\" when a recording stops mid-sentence: trailing runs of \".\", \"…\", and \"。\" are stripped on every engine (cloud transcription previously received no cleanup at all), single terminal periods survive, and interior ellipses are untouched."
              - listitem [ref=f12e428]: Update installs that fail because the app runs from a mounted DMG or another volume surfaced a generic auto-dismissing error; they now show a sticky toast with the actual fix — move BridgeVoice to Applications and retry.
        - article [ref=f12e429]:
          - generic [ref=f12e430]:
            - generic [ref=f12e431]: v2.5.3
            - generic [ref=f12e432]: 2026-06-12
          - heading [level=3] [ref=f12e433]:
            - link "Session loops ended, mic auto-recovery, steadier push-to-talk" [ref=f12e434] [cursor=pointer]:
              - /url: /changelog/bridgevoice/v2-5-3
          - paragraph [ref=f12e435]: BridgeVoice 2.5.3 stops expired sessions from silently retrying forever and prompts re-login instead, rebuilds silent microphone streams before giving up, and hardens push-to-talk against phantom releases and macOS event-tap drops.
          - list [ref=f12e436]:
            - listitem [ref=f12e437]:
              - generic [ref=f12e438]: Expired sessions now ask for re-login.
              - text: Permanently dead refresh tokens end the background retry loop, clear themselves, and surface the sign-in prompt instead of silently hammering the API.
            - listitem [ref=f12e439]:
              - generic [ref=f12e440]: Silent mics recover on their own.
              - text: A stream that delivers no audio rebuilds on the same device, then fails over to the next mic before the no-audio banner appears.
            - listitem [ref=f12e441]:
              - generic [ref=f12e442]: Push-to-talk holds its ground.
              - text: Recordings can no longer be cut by a phantom release in the first 150ms, and macOS event-tap drops self-heal with one aggregated diagnostic.
          - generic [ref=f12e443]:
            - paragraph [ref=f12e444]: Added
            - list [ref=f12e445]:
              - listitem [ref=f12e446]: Silent microphone streams now run a two-stage recovery — rebuild on the same device, then fail over to the next candidate — before the no-audio banner shows.
              - listitem [ref=f12e447]: Update checks identify themselves to the edge and retry once after 30 seconds; a scheduled canary now watches the update feed every 30 minutes.
              - listitem [ref=f12e448]: Switching to local transcription with a missing model falls back to the best downloaded model and says so, instead of erroring.
          - generic [ref=f12e449]:
            - paragraph [ref=f12e450]: Changed
            - list [ref=f12e451]:
              - listitem [ref=f12e452]: Audio capture moved to a wait-free ring buffer, so the realtime callback no longer drops samples under lock contention.
              - listitem [ref=f12e453]: Loopback devices (Stereo Mix, Line In, virtual cables) are excluded from automatic microphone fallback unless explicitly selected.
              - listitem [ref=f12e454]: Error reports truncate embedded HTML bodies, consolidate fragmented groupings, and skip known no-op messages.
          - generic [ref=f12e455]:
            - paragraph [ref=f12e456]: Fixed
            - list [ref=f12e457]:
              - listitem [ref=f12e458]: Permanently expired sessions (invalid or 30-day-old refresh tokens) stop retry-looping, clear the dead token, and prompt re-login; flaky networks can no longer bypass the auth failure hard-stop.
              - listitem [ref=f12e459]: Push-to-talk requires a real key-up during the first 150ms of a hold, ending sub-100ms phantom stops on virtual audio setups.
              - listitem [ref=f12e460]: Dictated text re-resolves its target window when the saved one is destroyed on Windows, and frontmost-app lookup runs in-process on macOS instead of shelling out to AppleScript.
              - listitem [ref=f12e461]: Command panics are caught and reported instead of aborting the app on Linux.
              - listitem [ref=f12e462]: Model downloads tolerate antivirus stat races on Windows with a short retry.
