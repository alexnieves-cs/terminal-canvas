            - heading [level=3] [ref=f12e53]:
              - link "Your coding agents are found from the Dock, and typing behaves again" [ref=f12e54] [cursor=pointer]:
                - /url: /changelog/bridgemind-one/v0-1-27
            - paragraph [ref=f12e55]: macOS only. Every fix from this week's macOS beta tickets in one update. Coding agents that only your .zshrc puts on PATH — Claude Code's native installer, npm's global bin, nvm, bun, OpenCode, Grok — are found when you launch from Finder or the Dock instead of showing as not installed, and when nothing is found the app says exactly which shells and folders it checked and offers Check again. Auto's task field no longer types backwards, and Korean, Japanese and Chinese input sources compose in the chat composer again.
            - list [ref=f12e56]:
              - listitem [ref=f12e57]:
                - generic [ref=f12e58]: CLIs on your .zshrc PATH are found.
                - text: Launching from Finder or the Dock now asks your login and interactive shells where your agents live, so a Claude Code, Codex, OpenCode or Grok install that only .zshrc knows about shows up instead of being reported as missing.
              - listitem [ref=f12e59]:
                - generic [ref=f12e60]: Nothing found? It tells you why.
                - text: Chat mode, the launch grid and the agent page list the shells asked and the folders checked, point at the ~/.zprofile fix, and offer Check again so a fresh install is picked up without relaunching.
              - listitem [ref=f12e61]:
                - generic [ref=f12e62]: Typing lands in order, and 한글 composes.
                - text: A custom task typed into Auto's field no longer comes out backwards, and Korean, Japanese and Chinese input sources compose whole syllables in the chat composer instead of scattering letters.
            - generic [ref=f12e63]:
              - paragraph [ref=f12e64]: Fixed
              - list [ref=f12e65]:
                - listitem [ref=f12e66]: Coding agents that only your .zshrc puts on PATH (Claude Code's native installer, npm's global bin, nvm, bun, OpenCode, Grok) are now found when you launch from Finder or the Dock instead of being reported as not installed.
                - listitem [ref=f12e67]: When no coding agent is found, Chat mode, the launch grid and the agent page say which shells were asked and which folders were checked, point at the ~/.zprofile fix, and offer Check again so a fresh install is picked up without relaunching.
                - listitem [ref=f12e68]: "A slow or prompting .zshrc no longer reads as \"not installed\": discovery still stops at its deadline and tells you the shell didn't answer, and a chat sent before it answers says so and asks you to send again."
                - listitem [ref=f12e69]: Typing a custom task into Auto's field no longer comes out backwards; each character lands after the last one, the way it does in the chat composer.
                - listitem [ref=f12e70]: "Korean, Japanese and Chinese input sources compose in the chat composer again: typing 한글 produces the two syllables rather than six separate letters, and a draft filled in from elsewhere waits for the syllable you are on to finish."
                - listitem [ref=f12e71]: A first Fn take before the on-device speech model is downloaded now says exactly where the Download button is (Settings → Voice, beside Apple Speech) instead of pointing at a "prepare" step that does not exist.
