          - heading [level=3] [ref=f12e329]:
            - link "Multi-account switching and resume that hold up" [ref=f12e330] [cursor=pointer]:
              - /url: /changelog/bridgespace/v3-2-2
          - paragraph [ref=f12e331]: "BridgeSpace 3.2.2 makes multi-account agents dependable: switching Claude accounts keeps you signed in, resumes run under the account profile the conversation belongs to, and session recovery is honest about what can and can't be resumed."
          - list [ref=f12e332]:
            - listitem [ref=f12e333]:
              - generic [ref=f12e334]: Connected accounts stay signed in.
              - text: Switching to a connected Claude account no longer re-runs the first-run wizard and its login screen — onboarding state is seeded from the CLI's real state file at connect and self-heals on every switch.
            - listitem [ref=f12e335]:
              - generic [ref=f12e336]: Resume follows the right account.
              - text: Resuming a recovered agent now runs under the account profile the conversation was created on. Previously the resume used whichever profile was active, so Claude answered "No conversation found" after an account switch.
            - listitem [ref=f12e337]:
              - generic [ref=f12e338]: Home-directory agents are recoverable.
              - text: Agents launched in a workspace rooted at the home folder were invisible to crash recovery — an empty Claude settings file silently blocked hook installation. They now register like any other agent and are offered for resume.
            - listitem [ref=f12e339]:
              - generic [ref=f12e340]: Resume failures speak up.
              - text: When a resumed agent can't start — wrong account, missing CLI — BridgeSpace surfaces a notification and keeps the session recoverable under Settings → History instead of losing it.
          - generic [ref=f12e341]:
            - paragraph [ref=f12e342]: Added
            - list [ref=f12e343]:
              - listitem [ref=f12e344]: Agent sessions record the Claude/Codex account profile and transcript path they ran under, powering profile-aware resume.
              - listitem [ref=f12e345]: Claude sessions register the moment the CLI starts (SessionStart hook), so an agent closed before its first reply is still offered for resume.
              - listitem [ref=f12e346]: Agents launched from the workspace UI are recorded at spawn time, so Codex agents no longer wait for their first turn to become recoverable.
          - generic [ref=f12e347]:
            - paragraph [ref=f12e348]: Changed
            - list [ref=f12e349]:
              - listitem [ref=f12e350]: The launch-time cleanup of user-level Claude hook entries now skips workspaces rooted at the home folder, whose project settings live in the same file.
          - generic [ref=f12e351]:
            - paragraph [ref=f12e352]: Fixed
            - list [ref=f12e353]:
              - listitem [ref=f12e354]: "Switching to a connected Claude account forced a re-login: the onboarding self-heal read .claude.json from inside ~/.claude, where the CLI never writes it — it now reads the real home-root state file, and connects seed it up front."
              - listitem [ref=f12e355]: Resumed agents launched under whichever account profile was active and failed with "No conversation found" when it differed — resume commands are now pinned to the conversation's own profile.
              - listitem [ref=f12e356]: A successful resume could be misread as failed when the replayed conversation contained phrases like "command not found", re-offering a duplicate resume — failure detection now stands down once the CLI demonstrably booted.
              - listitem [ref=f12e357]: Resuming a conversation whose transcript was never saved (closed before the first reply) typed a command guaranteed to fail; it is now blocked up front with a notification and the dead entry stops being re-offered on every boot.
              - listitem [ref=f12e358]: The default (un-profiled) Claude sign-in is now detected via its real Keychain item and state file, so Connect Accounts reports it accurately.
              - listitem [ref=f12e359]: An empty ~/.claude/settings.local.json permanently blocked hook installation for home-rooted workspaces; empty files are now treated as a fresh install, and refusals are logged where builders can find them.
              - listitem [ref=f12e360]: A failed resume silently consumed the session's recoverability; the session now returns to recoverable and a notification explains what happened.
