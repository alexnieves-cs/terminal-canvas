                - listitem [ref=f12e136]: Ask Bridge "where is the agent working on the login tests?" and it finds the session — a terminal pane in any workspace, a saved agent's chat or a Chat-mode thread — takes you there, highlights it, and tells you what it was last doing; when two fit it names them and asks. Bridge can also list every workspace, tab and pane at once.
                - listitem [ref=f12e137]: "Chat mode is now threads in your workspaces, the way T3 Code works: the sidebar lists your folders, each thread underneath is one coding session in that folder, and a new thread starts from the folder's +, the header's +, or Ctrl+N."
                - listitem [ref=f12e138]: Cursor, Grok Build and OpenCode can run a thread alongside Claude Code and Codex, through each CLI's Agent Client Protocol; the model menu lists what the agent reports, and the agent's permission asks appear above the composer with Allow / Allow for session / Deny.
