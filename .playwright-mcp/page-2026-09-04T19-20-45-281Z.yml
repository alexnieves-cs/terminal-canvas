              - listitem [ref=f12e165]:
                - generic [ref=f12e166]: Headphones on, desk mic kept.
                - text: With AirPods or another Bluetooth headset connected, Automatic no longer falls back to an iPhone's Continuity Camera mic or the wrong display mic. It remembers the desk microphone you were using and keeps it, so a Bridge call or a dictation hold hears you.
              - listitem [ref=f12e167]:
                - generic [ref=f12e168]: Silence is reported, not swallowed.
                - text: A microphone that opens but delivers no audio within a second now ends the take with "The microphone isn't delivering audio" and points you to Settings → Microphone, instead of resetting as if you had tapped too briefly.
              - listitem [ref=f12e169]:
