          - heading "Dictation" [level=1] [ref=f7e69]
          - paragraph [ref=f7e70]: Use BridgeMind One push-to-talk dictation on macOS with the Fn key, hands-free mode, microphone selection, and universal text placement.
          - paragraph [ref=f7e71]: BridgeMind One dictation lets you speak into your Mac and place the transcription into the app that was focused when you started.
          - paragraph [ref=f7e72]:
            - text: Dictation is currently a
            - strong [ref=f7e73]: macOS feature
            - text: . It requires an internet connection because audio is uploaded to BridgeMind's hosted Together Whisper transcription service. It is not an offline or on-device transcription mode.
          - heading [level=2] [ref=f7e74]:
            - link "Enable Dictation" [ref=f7e75] [cursor=pointer]:
              - /url: "#enable-dictation"
            - button "Copy Anchor Link" [ref=f7e76]
          - list [ref=f7e80]:
            - listitem [ref=f7e81]:
              - text: Open BridgeMind One
              - strong [ref=f7e82]: Settings
              - text: .
            - listitem [ref=f7e83]:
              - text: Turn on
              - strong [ref=f7e84]: Fn push-to-talk
              - text: .
            - listitem [ref=f7e85]: Choose a microphone if you do not want the default input.
            - listitem [ref=f7e86]:
              - text: Grant
              - strong [ref=f7e87]: Microphone
              - text: access in macOS System Settings.
            - listitem [ref=f7e88]:
              - text: Grant
              - strong [ref=f7e89]: Accessibility
              - text: access so BridgeMind One can observe the Fn gesture and paste text into the focused app.
          - paragraph [ref=f7e90]:
            - text: The permissions are under
            - strong [ref=f7e91]: System Settings → Privacy & Security → Microphone
            - text: and
            - strong [ref=f7e92]: Accessibility
            - text: .
          - heading [level=2] [ref=f7e93]:
            - link "Fn Gestures" [ref=f7e94] [cursor=pointer]:
              - /url: "#fn-gestures"
            - button "Copy Anchor Link" [ref=f7e95]
          - table [ref=f7e100]:
            - rowgroup [ref=f7e101]:
              - row [ref=f7e102]:
                - columnheader "Gesture" [ref=f7e103]
                - columnheader "Result" [ref=f7e104]
            - rowgroup [ref=f7e105]:
              - row [ref=f7e106]:
                - cell [ref=f7e107]:
                  - strong [ref=f7e108]: Hold Fn, then release
                - cell "Record while held, transcribe on release, and place the text into the original app" [ref=f7e109]
              - row [ref=f7e110]:
                - cell [ref=f7e111]:
                  - strong [ref=f7e112]: Double-tap Fn
                - cell "Start hands-free recording" [ref=f7e113]
              - row [ref=f7e114]:
                - cell [ref=f7e115]:
                  - strong [ref=f7e116]: Tap Fn while hands-free
                - cell "Stop, transcribe, and place the text" [ref=f7e117]
              - row [ref=f7e118]:
                - cell [ref=f7e119]:
                  - strong [ref=f7e120]: One quick tap
                - cell "Do nothing, which prevents accidental short recordings" [ref=f7e121]
          - paragraph [ref=f7e122]: You can disable the physical Fn gesture at any time in Settings. The on-screen voice control remains available.
          - heading [level=2] [ref=f7e123]:
            - link "What You See" [ref=f7e124] [cursor=pointer]:
              - /url: "#what-you-see"
            - button "Copy Anchor Link" [ref=f7e125]
          - paragraph [ref=f7e129]: On a MacBook with a notch, the dictation state appears as a compact pill around the notch. On a display without a notch, BridgeMind One shows a small floating status surface instead.
          - paragraph [ref=f7e130]: The surface distinguishes listening, transcribing, and error states so you can tell whether it is still capturing audio.
          - heading [level=2] [ref=f7e131]:
            - link "Where Text Goes" [ref=f7e132] [cursor=pointer]:
              - /url: "#where-text-goes"
            - button "Copy Anchor Link" [ref=f7e133]
          - paragraph [ref=f7e137]: BridgeMind One remembers the app that was focused when dictation began. After transcription, it returns the text through the standard paste flow.
          - paragraph [ref=f7e138]: Accessibility permission is required for global Fn detection and text placement. Clipboard managers or apps that block simulated paste can interfere with the final step.
          - heading [level=2] [ref=f7e139]:
            - link "Microphone Selection" [ref=f7e140] [cursor=pointer]:
              - /url: "#microphone-selection"
            - button "Copy Anchor Link" [ref=f7e141]
          - paragraph [ref=f7e145]:
            - text: Choose an input in
            - strong [ref=f7e146]: Settings → Microphone
            - text: . When another microphone is available, BridgeMind One avoids switching a Bluetooth headset into its lower-quality call-audio mode.
          - paragraph [ref=f7e147]: If the selected device disappears, reopen Settings and choose an available input before the next recording.
          - heading [level=2] [ref=f7e148]:
            - link "Audio and Privacy" [ref=f7e149] [cursor=pointer]:
              - /url: "#audio-and-privacy"
            - button "Copy Anchor Link" [ref=f7e150]
          - paragraph [ref=f7e154]: "Audio is uploaded over HTTPS to BridgeMind's Together Whisper transcription service. Treat spoken content the same way you would treat text sent to a hosted AI service:"
          - list [ref=f7e155]:
            - listitem [ref=f7e156]: Do not dictate passwords, private keys, or authentication codes.
            - listitem [ref=f7e157]: Follow your organization's policy for confidential or regulated information.
            - listitem [ref=f7e158]: Stop the recording if the wrong application or conversation is in focus.
          - heading [level=2] [ref=f7e159]:
            - link "Troubleshooting" [ref=f7e160] [cursor=pointer]:
              - /url: "#troubleshooting"
            - button "Copy Anchor Link" [ref=f7e161]
          - heading [level=3] [ref=f7e165]:
            - link "Fn works only inside BridgeMind One" [ref=f7e166] [cursor=pointer]:
              - /url: "#fn-works-only-inside-bridgemind-one"
            - button "Copy Anchor Link" [ref=f7e167]
          - paragraph [ref=f7e171]:
            - text: Confirm that
            - strong [ref=f7e172]: Accessibility
            - text: permission is enabled for the installed BridgeMind One app, then quit and reopen it.
          - heading [level=3] [ref=f7e173]:
            - link "Recording does not start" [ref=f7e174] [cursor=pointer]:
              - /url: "#recording-does-not-start"
            - button "Copy Anchor Link" [ref=f7e175]
          - paragraph [ref=f7e179]:
            - text: Confirm
            - strong [ref=f7e180]: Microphone
            - text: permission, verify that an input device is connected, and check that Fn push-to-talk is enabled.
          - heading [level=3] [ref=f7e181]:
            - link "Transcription finishes but no text appears" [ref=f7e182] [cursor=pointer]:
              - /url: "#transcription-finishes-but-no-text-appears"
            - button "Copy Anchor Link" [ref=f7e183]
          - paragraph [ref=f7e187]: Return focus to the target app, confirm Accessibility permission, and check whether that app accepts normal paste commands.
          - heading [level=3] [ref=f7e188]:
            - link "The wrong microphone is active" [ref=f7e189] [cursor=pointer]:
              - /url: "#the-wrong-microphone-is-active"
            - button "Copy Anchor Link" [ref=f7e190]
          - paragraph [ref=f7e194]: Select the desired input explicitly in BridgeMind One Settings before starting another recording.
