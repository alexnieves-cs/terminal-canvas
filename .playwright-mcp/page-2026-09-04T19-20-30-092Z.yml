          - paragraph [ref=f9e266]: Name an agent, give it a brief, put it on a routine. The work runs on a schedule — you review the result.
        - generic [ref=f9e268]:
          - generic [ref=f9e269]: Code
          - heading "Your terminals, your folders." [level=3] [ref=f9e275]
          - paragraph [ref=f9e276]: Live shells over the folders you already work in, with a browser or a thread docked beside them. The full workspace is one fold down.
        - generic [ref=f9e278]:
          - generic [ref=f9e279]: Chat
          - heading "A conversation, not a repo." [level=3] [ref=f9e285]
          - paragraph [ref=f9e286]: Threads that are not tied to a project. Drop a file, ask a question, keep the thread. Sandboxed, so the engine cannot pretend it is inside your codebase.
